name: Build Android APK

# Manual trigger — produces an installable APK via EAS. The build itself runs
# on Expo's servers; this job just kicks it off and waits for the URL.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build APK
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait

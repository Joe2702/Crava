name: Build APK

# Builds an installable Android APK entirely on GitHub's runners.
# No Expo account, no EAS, no secrets, nothing to install locally.
# Actions tab -> Build APK -> Run workflow -> download the artifact when done.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Which backend the APK should talk to
        default: demo
        type: choice
        options:
          - demo      # in-memory, no Firebase needed
          - firebase  # uses the FIREBASE_* repository secrets
      all_architectures:
        description: Build for every CPU architecture (needed only for x86 emulators; ~4x slower)
        default: false
        type: boolean
      publish:
        description: Publish as a GitHub Release (a plain link a phone can install from)
        default: true
        type: boolean

# contents: write is for creating the release below. Everything else here only
# reads the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native's Gradle plugin needs a modern JDK; the runner's default
      # is not guaranteed to be one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: mobile
        run: npm test

      # .env is git-ignored, so without this the build has no config and the
      # app starts in demo mode — which is the point of the "demo" option.
      - name: Write Firebase config
        if: inputs.backend == 'firebase'
        working-directory: mobile
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::backend=firebase needs the FIREBASE_* repository secrets set."
            exit 1
          fi
          cat > .env <<EOF
          EXPO_PUBLIC_FIREBASE_API_KEY=$API_KEY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=$AUTH_DOMAIN
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=$STORAGE_BUCKET
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$SENDER_ID
          EXPO_PUBLIC_FIREBASE_APP_ID=$APP_ID
          EXPO_PUBLIC_FIREBASE_REGION=europe-west1
          EOF

      # Generates the native android/ project from app.json. Its release build
      # type is signed with the bundled debug keystore, so the APK installs
      # without any signing secrets. Fine for testing; a real Play release
      # needs a keystore of your own.
      - name: Generate native project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # New Architecture compiles React Native's C++ from source, once per CPU
      # architecture. Prebuild defaults to all four, which does not finish in a
      # sensible time on a 2-core runner. Every Android phone worth targeting is
      # arm64-v8a; the others are only needed for x86 emulators.
      - name: Build release APK
        working-directory: mobile/android
        env:
          ARCHS: ${{ inputs.all_architectures && 'armeabi-v7a,arm64-v8a,x86,x86_64' || 'arm64-v8a' }}
        run: |
          chmod +x ./gradlew
          # The runner has far more memory than prebuild's conservative default.
          # The leading \n matters: prebuild writes gradle.properties with no
          # trailing newline, so a plain `echo >>` lands on the end of the last
          # line instead of a new one. That line is
          # expo.inlineModules.watchedDirectories=[], which the Expo autolinking
          # plugin passes to node as JSON — appending to it made the build die
          # with an unattributed "Process 'command 'node'' finished with
          # non-zero exit value 1".
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          echo "--- tail of gradle.properties ---"
          tail -3 gradle.properties
          ./gradlew assembleRelease \
            -PreactNativeArchitectures="$ARCHS" \
            --no-daemon \
            --stacktrace

      # Gradle reporting success is not proof an APK landed where expected, so
      # locate it explicitly and fail with a directory listing rather than the
      # upload step's bare "no files found".
      - name: Locate the APK
        id: apk
        run: |
          found=$(find mobile/android -name '*.apk' -type f | head -1)
          if [ -z "$found" ]; then
            echo "::error::Gradle finished but produced no APK."
            echo "Contents of mobile/android/app/build/outputs (if it exists):"
            ls -R mobile/android/app/build/outputs 2>&1 || echo "  (no outputs directory)"
            exit 1
          fi
          echo "Found $found ($(du -h "$found" | cut -f1))"
          # Copied to a fixed name so the release asset URL never changes.
          cp "$found" crava.apk
          echo "path=crava.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h crava.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "tag=crava-${{ inputs.backend }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # A release asset is a direct link with no login and no zip, so it can be
      # opened and installed straight from a phone browser. The artifact above
      # can only be downloaded as a zip by someone signed in to GitHub.
      #
      # The asset is always named crava.apk, which is what keeps
      # /releases/latest/download/crava.apk pointing at the newest build. The
      # release title and notes say which backend it talks to.
      - name: Publish release
        if: inputs.publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          ARCHS_LABEL: ${{ inputs.all_architectures && 'all four' || 'arm64-v8a only' }}
        run: |
          # Quoted heredoc: nothing in the notes is expanded by the shell.
          cat > notes.md <<'EOF'
          Open **crava.apk** below on an Android phone and tap it. Android will warn
          about installing outside the Play Store; allow it.

          Signed with Expo's debug keystore — fine for testing and for sending to
          people directly, but a Play Store release needs a keystore of your own,
          because you cannot ship updates that install over a differently signed APK.
          EOF
          {
            echo "Backend: **${{ inputs.backend }}**"
            echo "Architectures: $ARCHS_LABEL"
            echo "Commit: ${GITHUB_SHA::7}"
            echo
          } | cat - notes.md > notes-full.md

          gh release create "$TAG" crava.apk \
            --title "Crava ${{ inputs.backend }} · ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --notes-file notes-full.md
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/crava.apk" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## APK ready"
            echo
            echo "Backend: **${{ inputs.backend }}**"
            echo
            echo "Architectures: ${{ inputs.all_architectures && 'all four' || 'arm64-v8a only' }}"
            echo
            echo "Size: ${{ steps.apk.outputs.size }}"
            echo
            if [ -n "${{ steps.release.outputs.url }}" ]; then
              echo "### Install on a phone"
              echo
              echo "Open this on the phone itself and tap the downloaded file:"
              echo
              echo "    ${{ steps.release.outputs.url }}"
              echo
              echo "Always-newest link: <https://github.com/$GITHUB_REPOSITORY/releases/latest/download/crava.apk>"
            else
              echo "Publishing was skipped. Download **${{ steps.apk.outputs.tag }}** from the"
              echo "Artifacts section of this run and unzip it."
            fi
            echo
            echo "Android will warn about installing outside the Play Store — allow it."
          } >> "$GITHUB_STEP_SUMMARY"
